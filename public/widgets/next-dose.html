<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Next Dose</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0a0e17; color: #e2e8f0;
      font-family: 'DM Sans', system-ui, sans-serif; }
    .wrap { display: flex; flex-direction: column; justify-content: center;
      height: 100%; padding: 14px 16px; box-sizing: border-box; }
    .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      color: #64748b; margin-bottom: 6px; }
    .pep { font-size: 22px; font-weight: 700; line-height: 1.1; }
    .meta { font-size: 14px; color: #94a3b8; margin-top: 6px; }
    .none { font-size: 15px; color: #64748b; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      background: #00d4aa; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label"><span class="dot"></span>Next dose</div>
    <div id="content"><div class="none">Loading…</div></div>
  </div>
  <script>
    // Self-contained widget: reads the same IndexedDB the app uses (no bundler).
    const DB = 'pepdose', STORE = 'scheduledDoses', VIEW_FILTER_KEY = 'pepdose-view-filter';
    // Mirrors ViewFilterContext / notifications.ts: Victor and Nadia share the
    // device, so the widget must honour the active profile filter or it shows
    // the other profile's dose on the home screen.
    function activeOwnerFilter() {
      try {
        const raw = localStorage.getItem(VIEW_FILTER_KEY);
        return raw === 'Victor' || raw === 'Nadia' ? raw : 'all';
      } catch { return 'all'; }
    }
    function openDB() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(DB);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    async function nextDose() {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => {
          const today = new Date().toISOString().slice(0, 10);
          const now = new Date();
          const owner = activeOwnerFilter();
          const upcoming = req.result
            .filter(d => owner === 'all' || d.owner === owner)
            .filter(d => d.status === 'upcoming' && (d.date > today || (d.date === today && d.time >= '00:00')))
            .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
          res(upcoming[0] || null);
        };
        req.onerror = () => rej(req.error);
      });
    }
    function fmt(d) {
      const dt = new Date(d.date + 'T' + (d.time || '08:00'));
      return dt.toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    }
    // DB fields are user-influenced (and cloud-synced) — escape before innerHTML.
    function esc(v) {
      return String(v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
    }
    nextDose().then(d => {
      const el = document.getElementById('content');
      if (!d) { el.innerHTML = '<div class="none">No upcoming doses</div>'; return; }
      el.innerHTML =
        '<div class="pep">' + esc(d.peptideId || 'Dose') + '</div>' +
        '<div class="meta">' + esc(d.dose) + ' ' + esc(d.unit) + ' · ' + esc(fmt(d)) + '</div>';
    }).catch(() => {
      document.getElementById('content').innerHTML = '<div class="none">Unavailable</div>';
    });
  </script>
</body>
</html>
